#
#   Name Your Summons Release Automation
#
# Triggered by tag pushes matching the semantic version pattern (created by
# `./make.ps1 create-release-tag`). Packs the mod .pak on a Windows runner
# (divine.exe is Windows-only), attests its provenance, and publishes a draft
# GitHub release built from templates/release_template.md + CHANGELOG.md.

name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

defaults:
  run:
    shell: pwsh

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('make.ps1') }}

      - name: Pack the mod
        run: ./make.ps1 build

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            build/NameYourSummons-${{ github.ref_name }}.pak
            build/NameYourSummons-${{ github.ref_name }}.zip
          retention-days: 1
          if-no-files-found: error

  create-draft-release:
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: ./artifacts

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: artifacts/NameYourSummons-${{ github.ref_name }}.zip

      - name: Create draft release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const version = context.ref.replace('refs/tags/', '');

            // Read and process the release template.
            const templatePath = path.join(process.cwd(), 'templates', 'release_template.md');
            let releaseBody = fs.readFileSync(templatePath, 'utf8');

            // Extract this version's section from CHANGELOG.md.
            const changelogContent = fs.readFileSync(path.join(process.cwd(), 'CHANGELOG.md'), 'utf8');
            const lines = changelogContent.split('\n');
            let currentChangelog = 'No changelog entries found for this version.';
            let inTargetVersion = false;
            const changelogLines = [];
            for (const line of lines) {
              if (line.startsWith('## ') && line.includes(version)) {
                inTargetVersion = true;
                continue;
              }
              if (inTargetVersion && line.startsWith('## ')) {
                break;
              }
              if (inTargetVersion) {
                changelogLines.push(line);
              }
            }
            if (changelogLines.length > 0) {
              currentChangelog = changelogLines.join('\n').trim();
            }

            releaseBody = releaseBody.replace(/\{\{VERSION\}\}/g, version);
            releaseBody = releaseBody.replace(/\{\{CHANGELOG\}\}/g, currentChangelog);

            console.log('Creating draft release for version:', version);
            console.log(releaseBody);

            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `Version ${version}`,
              body: releaseBody,
              draft: true,
              prerelease: false
            });

            const assetName = `NameYourSummons-${version}.zip`;
            const assetData = fs.readFileSync(path.join(process.cwd(), 'artifacts', assetName));
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: assetName,
              data: assetData,
              headers: {
                'content-type': 'application/zip',
                'content-length': assetData.length
              }
            });

            console.log('Draft release ready for review at:', release.data.html_url);
