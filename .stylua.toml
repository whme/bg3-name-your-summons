# Adopt StyLua's opinionated defaults verbatim. StyLua is a deterministic,
# Prettier-style formatter that follows the Roblox Lua Style Guide; taking its
# defaults is the "no bikeshedding" best practice and keeps formatting an
# implementation detail rather than a project style to maintain.
column_width = 120
line_endings = "Unix"
indent_type = "Tabs"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"
