name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# ubuntu-latest ships pwsh, so every job runs the same make.ps1 entrypoint used
# locally. make.ps1 downloads its own pinned tooling into .tools/, which we cache
# keyed on the script (bump a version in make.ps1 -> cache busts automatically).
defaults:
  run:
    shell: pwsh

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('make.ps1') }}
      - run: ./make.ps1 format-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('make.ps1') }}
      - run: ./make.ps1 lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('make.ps1') }}
      - run: ./make.ps1 typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('make.ps1') }}
      - run: ./make.ps1 test

  validate-xml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./make.ps1 validate-xml

  ascii-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./make.ps1 ascii-check

  # Resolves the mod's XAML against the committed HMAC oracle (no game install
  # needed). Skips cleanly when the salt secret is absent - e.g. a fork PR - so it
  # never blocks a build it cannot run. Regenerate the oracle with xaml-extract.
  xaml-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./make.ps1 xaml-check
        env:
          NYS_XAML_ORACLE_SALT: ${{ secrets.NYS_XAML_ORACLE_SALT }}
