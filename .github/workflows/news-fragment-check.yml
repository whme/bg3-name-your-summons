#
#   News Fragment Check
#
# Ensures PRs either include a news fragment or explicitly acknowledge they
# don't need one. Runs on PR events and label changes. The result is posted
# back to the PR as a comment by post-pr-comment.yml (which runs with write
# permissions the fork-originated PR event does not have).

name: News Fragment Check

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]
    branches:
      - main
      - "*-maintenance"

env:
  OVERRIDE_LABEL: "no-news-fragment-needed"
  # A file that looks like a fragment: a valid type suffix, directly in news/.
  NEWS_FRAGMENT_PATTERN: '^news/[^/]+\.(feature|bugfix|security|deprecation|removal)\.md$'
  # A fragment changelogging will actually pick up: the id must be a PR/issue
  # number or a `~`-prefixed name. A bare slug is dropped without warning.
  NEWS_ID_PATTERN: '^news/([0-9]+|~[^/]+)\.(feature|bugfix|security|deprecation|removal)\.md$'

jobs:
  news-fragment-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for news fragments
        id: check
        shell: bash
        run: |
          echo "Checking for news fragments in PR..."

          # Diff against the PR's actual base so this works for both `main`
          # and `*-maintenance`.
          ADDED=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD")
          FRAGMENTS=$(echo "$ADDED" | grep -E '${{ env.NEWS_FRAGMENT_PATTERN }}' || true)

          # Fragment-shaped files whose id changelogging would silently drop.
          # Reject these even under the override label - they are always a mistake.
          MALFORMED=""
          VALID=""
          if [ -n "$FRAGMENTS" ]; then
            VALID=$(echo "$FRAGMENTS" | grep -E '${{ env.NEWS_ID_PATTERN }}' || true)
            MALFORMED=$(echo "$FRAGMENTS" | grep -Ev '${{ env.NEWS_ID_PATTERN }}' || true)
          fi

          if [ -n "$MALFORMED" ]; then
            echo "Malformed news fragment name(s) - changelogging would ignore these:"
            echo "$MALFORMED" | sed 's/^/  - /'
            {
              echo "status=malformed"
              echo "malformed<<FRAGMENTS_EOF"
              echo "$MALFORMED"
              echo "FRAGMENTS_EOF"
            } >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -n "$VALID" ]; then
            echo "News fragment(s) found:"
            echo "$VALID" | sed 's/^/  - /'
            echo "status=success" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "${{ contains(github.event.pull_request.labels.*.name, env.OVERRIDE_LABEL) }}" == "true" ]]; then
            echo "No news fragment needed (acknowledged via '${{ env.OVERRIDE_LABEL }}' label)"
            echo "status=success" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "No news fragment found and no acknowledgment label present"
          echo "status=failed" >> $GITHUB_OUTPUT

      - name: Prepare comment content
        shell: bash
        run: |
          mkdir -p comment
          echo "${{ github.event.number }}" > comment/pr_number.txt
          echo "news-fragment-check" > comment/header.txt

      - name: Prepare comment content - Success
        if: steps.check.outputs.status == 'success'
        shell: bash
        run: |
          cat > comment/body.txt << 'EOF'
          **News Fragment Check**

          Success! This PR meets the news fragment requirements.
          EOF

      - name: Prepare comment content - Malformed news fragment
        if: steps.check.outputs.status == 'malformed'
        env:
          MALFORMED: ${{ steps.check.outputs.malformed }}
        shell: bash
        run: |
          {
            cat << 'EOF'
          **News Fragment Check**

          This PR adds a news fragment whose name changelogging silently ignores,
          so the change would be missing from the changelog.

          A fragment id must be a **PR/issue number** (e.g. `news/123.bugfix.md`) or
          an **arbitrary name prefixed with `~`** (e.g. `news/~fix-summon.bugfix.md`).
          A bare non-numeric name is dropped without warning.

          Rename the fragment(s) below to a valid id:
          EOF
            printf '%s\n' "$MALFORMED" | sed 's/^/- `/; s/$/`/'
          } > comment/body.txt

      - name: Prepare comment content - Missing news fragment
        if: steps.check.outputs.status == 'failed'
        shell: bash
        run: |
          cat > comment/body.txt << 'EOF'
          **News Fragment Check**

          This PR appears to be missing a news fragment.

          **If this change affects users** (new features, bug fixes, security fixes):
          -> Add a news fragment in the `news/` directory
          -> Example: `news/123.feature.md` or `news/~fix-issue.bugfix.md`
          -> Fragment ids are a PR/issue number, or an arbitrary name prefixed with `~`

          **If this change doesn't need a news fragment** (docs, CI, internal changes):
          -> Add the `${{ env.OVERRIDE_LABEL }}` label to this PR

          For more information about news fragments, see: https://github.com/nekitdev/changelogging
          EOF

      - name: Upload comment artifact
        uses: actions/upload-artifact@v7
        with:
          name: comment
          path: comment/

      - if: steps.check.outputs.status != 'success'
        shell: bash
        run: exit 1
